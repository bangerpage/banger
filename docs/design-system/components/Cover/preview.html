<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
html,body{margin:0;background:var(--paper)}
.cover{position:relative;width:960px;height:288px;background:var(--paper);overflow:hidden}
.cover svg{position:absolute;left:0;top:0}
.signal{fill:var(--signal)}
.ink{fill:var(--ink)}
.lime{fill:var(--lime)}
.frame{fill:none;stroke:var(--paper);stroke-width:3}
.dot{fill:var(--ink)}
.slab{rx:var(--radius-l)}
.tile{rx:var(--radius-s)}
.text{position:absolute;left:48px;bottom:44px;max-width:440px}
.name{font-family:var(--font-display);font-weight:800;font-size:120px;line-height:.92;letter-spacing:-0.03em;color:var(--ink);font-variation-settings:'opsz' 96;margin:0}
.tag{font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--ink-muted);margin:12px 0 0}
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: signal 360x320 slab (largest, bleeds top/right), ink 176x112 radius-l, lime 96x64 radius-l
arrangement: one tall slab bleeding off the top-right with two satellites below-left, all right of x=480
pattern: literal motif of the logo (16:9 screen + stop dot) — five 64x36 frames radius-s with a dot, climbing across the slab like the camera path
scales: frame pitch space-16 (64) across / space-8 (32) up, gaps space-6, radii radius-s and radius-l
-->
<rect class="signal slab" x="616" y="-40" width="384" height="368"></rect>
<rect class="ink slab" x="488" y="152" width="176" height="112"></rect>
<rect class="lime slab" x="520" y="56" width="96" height="64"></rect>
<rect class="frame tile" x="664" y="200" width="64" height="36"></rect>
<circle class="dot" cx="696" cy="218" r="5"></circle>
<rect class="frame tile" x="728" y="168" width="64" height="36"></rect>
<circle class="dot" cx="760" cy="186" r="5"></circle>
<rect class="frame tile" x="792" y="136" width="64" height="36"></rect>
<circle class="dot" cx="824" cy="154" r="5"></circle>
<rect class="frame tile" x="856" y="104" width="64" height="36"></rect>
<circle class="dot" cx="888" cy="122" r="5"></circle>
<rect class="frame tile" x="856" y="40" width="64" height="36"></rect>
<circle class="dot" cx="888" cy="58" r="5"></circle>
</svg>
<div class="text">
<p class="name">banger</p>
<p class="tag">スライドショーしない、すべらないプレゼン。</p>
</div>
</div>
<script>/* static cover */</script>
</body>
</html>
