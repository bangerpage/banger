<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Banger basic</title>
</head>
<body>
<script type="module" src="https://cdn.jsdelivr.net/npm/@bangerpage/core@0.1.2/dist/index.js"></script>
<bang-root theme="light">
  <bang-frame id="intro" at="0,0">
    <bang-title>めくらないプレゼン</bang-title>
    <bang-text>Banger の基本デッキ</bang-text>
  </bang-frame>
  <bang-frame id="points" at="1,0">
    <bang-title size="m">ポイント</bang-title>
    <bang-text>キャンバスを動く</bang-text>
    <bang-list step="1"><li>停止点で止まる</li></bang-list>
  </bang-frame>
  <bang-frame id="numbers" at="2,0">
    <bang-columns ratio="1:1">
      <bang-stat value="1,200" label="members"></bang-stat>
      <bang-text>コミュニティの人数</bang-text>
    </bang-columns>
  </bang-frame>
  <bang-path>
    <bang-stop frame="intro"><bang-notes>導入</bang-notes></bang-stop>
    <bang-stop frame="points" steps="1"><bang-notes>ポイントを順に出す</bang-notes></bang-stop>
    <bang-stop frame="points" region="0,0,0.5,1"><bang-notes>左半分に寄る</bang-notes></bang-stop>
    <bang-stop frame="points" region="0.5,0,0.5,1"><bang-notes>右半分に寄る</bang-notes></bang-stop>
    <bang-stop overview><bang-notes>全体を見る</bang-notes></bang-stop>
  </bang-path>
</bang-root>
</body>
</html>
