<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Banger nested</title>
</head>
<body>
<script type="module" src="https://cdn.jsdelivr.net/npm/@bangerpage/core@0.2.4/dist/index.js"></script>
<bang-root theme="light">
  <bang-frame id="whole" at="0,0" span="4,3">
    <bang-title>全体の絵</bang-title>
    <bang-text id="verdict" data-step="1">結論は最後に出る</bang-text>
    <bang-frame id="a" at="0,2" span="2,1">
      <bang-title size="m">最初の子</bang-title>
      <bang-text data-step="1">段で出る</bang-text>
      <bang-text id="a-note">寄る先の文</bang-text>
      <bang-frame id="g" at="1,0">
        <bang-title size="m">孫</bang-title>
      </bang-frame>
    </bang-frame>
    <bang-frame id="b" at="2,2">
      <bang-title size="m">隣の子</bang-title>
    </bang-frame>
  </bang-frame>
  <bang-frame id="other" at="0,3">
    <bang-title>ほかのフレーム</bang-title>
  </bang-frame>
  <bang-path>
    <bang-stop frame="whole" steps="0"><bang-notes>全体の絵を見せる</bang-notes></bang-stop>
    <bang-stop frame="a" steps="1"><bang-notes>最初の子に寄る</bang-notes></bang-stop>
    <bang-stop frame="a" focus="a-note"><bang-notes>文に寄る</bang-notes></bang-stop>
    <bang-stop frame="g"><bang-notes>孫に寄る</bang-notes></bang-stop>
    <bang-stop frame="b"><bang-notes>隣の子へ滑る</bang-notes></bang-stop>
    <bang-stop frame="whole" steps="1"><bang-notes>親に戻って結論を出す</bang-notes></bang-stop>
    <bang-stop frame="other"><bang-notes>ほかのフレーム</bang-notes></bang-stop>
  </bang-path>
</bang-root>
</body>
</html>
