name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/cli; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but the tag is v$tag"
              exit 1
            fi
          done
      - run: pnpm gen:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -C packages/core exec playwright-core install --with-deps chromium
      - run: pnpm test:e2e
      # pnpm pack turns workspace:* into the real version; npm publish then signs in to npm with the
      # workflow's OIDC token (trusted publishing), so no npm token is stored in the repository.
      - name: Publish core, then cli
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          for pkg in packages/core packages/cli; do
            pnpm -C "$pkg" pack --pack-destination "$RUNNER_TEMP/pack"
          done
          version="${GITHUB_REF_NAME#v}"
          for name in core cli; do
            # A version already on npm (published by hand, or by an earlier run of this tag) is left as it is.
            if npm view "@bangerpage/$name@$version" version >/dev/null 2>&1; then
              echo "@bangerpage/$name@$version is already on npm; skipped"
            else
              npm publish "$RUNNER_TEMP"/pack/bangerpage-$name-*.tgz --access public
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
