<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banger minimal</title>
</head>
<body>
<script type="module" src="https://cdn.jsdelivr.net/npm/@bangerpage/core@0.2.1/dist/index.js"></script>
<bang-root theme="light">
  <bang-frame id="intro" at="0,0">
    <bang-title>めくらないプレゼン</bang-title>
    <bang-list step="1">
      <li>フレームをキャンバスに並べる</li>
      <li>カメラが停止点で止まる</li>
    </bang-list>
  </bang-frame>
  <bang-frame id="numbers" at="1,0">
    <bang-columns ratio="1:1">
      <bang-stat value="1,200" label="members"></bang-stat>
      <bang-image src="assets/banger-mark.svg" alt="Banger のマーク"></bang-image>
    </bang-columns>
  </bang-frame>
  <bang-frame id="growth" at="2,0">
    <bang-title size="m">参加者の推移</bang-title>
    <bang-chart>
      <script type="application/json">
        {
          "xAxis": { "type": "category", "data": ["2024", "2025", "2026"] },
          "yAxis": { "type": "value" },
          "series": [{ "type": "bar", "data": [300, 700, 1200] }]
        }
      </script>
    </bang-chart>
  </bang-frame>
  <bang-path>
    <bang-stop frame="intro" steps="2"><bang-notes>まず全体の考え方を話す</bang-notes></bang-stop>
    <bang-stop frame="numbers" region="0,0,0.5,1"><bang-notes>人数に寄る</bang-notes></bang-stop>
    <bang-stop frame="growth"><bang-notes>推移を見せる</bang-notes></bang-stop>
    <bang-stop overview><bang-notes>全体を見渡す</bang-notes></bang-stop>
  </bang-path>
</bang-root>
</body>
</html>
